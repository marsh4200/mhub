name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement you have in mind.
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: What problem does it solve?
      description: Explain the use case — what are you trying to do that isn't possible today?

  - type: dropdown
    id: area
    attributes:
      label: Which area does this relate to?
      options:
        - Media player / switching
        - IR control
        - System power
        - Sensors / status
        - Lovelace card (mhub-card)
        - Config flow / setup
        - Other

  - type: input
    id: mhub_model
    attributes:
      label: MHUB model (if relevant)
      placeholder: "e.g. MHUB U (4x3+1) 40"
